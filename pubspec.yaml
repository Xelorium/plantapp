name: plantapp
description: "PlantApp"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter


  flutter_bloc: ^9.1.1
  dio: ^5.9.0
  auto_route: ^11.0.0
  get_it: ^9.2.0
  injectable: ^2.7.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  retrofit: ^4.9.1
  fpdart: ^1.2.0

  auto_size_text: ^3.0.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  #flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0

  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  auto_route_generator: ^10.4.0
  injectable_generator: ^2.9.0
  retrofit_generator: ^10.2.0



flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/icons/navigation/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/roboto/Roboto-Black.ttf
          weight: 900
