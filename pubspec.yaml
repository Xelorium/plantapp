name: plantapp
description: "PlantApp"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter


  flutter_bloc: ^9.1.1
  dio: ^5.9.0
  auto_route: ^11.0.0
  get_it: ^9.1.1
  injectable: ^2.7.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  retrofit: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  #flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0

  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  auto_route_generator: ^10.4.0
  injectable_generator: ^2.9.0
  retrofit_generator: ^10.2.0



flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
